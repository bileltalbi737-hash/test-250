<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet</title>
<meta name="description" content="Un carnet de tâches impressionniste, tout doux, qui reste chez toi.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8f3e9" media="(prefers-color-scheme: light)">

<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-rounded.png">

</head>
<body>

  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3 7 7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></symbol>

<div id="paint-bg" aria-hidden="true"></div>
<div id="backdrop"></div>

<div id="app">
  <aside id="sidebar" aria-label="Navigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="brand-text">
        <div class="brand-name">Carnet</div>
        <div class="brand-sub" id="brand-sub">petit carnet impressionniste</div>
      </div>
      <button id="btn-close-sidebar" class="icon-btn only-mobile" aria-label="Fermer le menu"><svg><use href="#i-x"/></svg></button>
    </div>

    <nav id="nav-smart" class="nav"></nav>

    <div class="side-title">
      <span>Mes listes</span>
      <button id="btn-new-list" class="icon-btn small" aria-label="Nouvelle liste" title="Nouvelle liste"><svg><use href="#i-plus"/></svg></button>
    </div>
    <nav id="nav-lists" class="nav"></nav>

    <div class="side-foot">
      <button id="btn-settings" class="side-link"><svg><use href="#i-settings"/></svg><span>Réglages</span></button>
      <button id="sync-pill" class="sync-pill" title="Synchronisation"><span class="dot"></span><span class="label">Local</span></button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="btn-menu" class="icon-btn only-mobile" aria-label="Ouvrir le menu"><svg><use href="#i-menu"/></svg></button>
      <div class="topbar-title">
        <h1 id="view-title">Aujourd'hui</h1>
        <div id="view-sub" class="view-sub"></div>
      </div>
      <div class="topbar-actions">
        <button id="btn-search" class="icon-btn" aria-label="Rechercher" title="Rechercher (⌘K)"><svg><use href="#i-search"/></svg></button>
        <button id="btn-view-menu" class="icon-btn" aria-label="Options d'affichage" title="Tri et affichage"><svg><use href="#i-sliders"/></svg></button>
      </div>
    </header>

    <section id="content" class="content" aria-live="polite"></section>

    <form id="quickadd" autocomplete="off">
      <div id="qa-chips" class="qa-chips" aria-live="polite"></div>
      <div class="qa-row">
        <button type="button" id="qa-more" class="icon-btn" aria-label="Ajouter avec les détails" title="Ajouter avec les détails"><svg><use href="#i-note"/></svg></button>
        <input id="qa-input" type="text" placeholder="Ajouter une tâche… ex : Corriger copies demain 17h !!" enterkeyhint="done" spellcheck="true">
        <button type="submit" id="qa-add" class="qa-add" aria-label="Ajouter"><svg><use href="#i-plus"/></svg></button>
      </div>
    </form>
  </main>
</div>

<div id="sheet-root"></div>
<div id="popover-root"></div>
<div id="toast-root"></div>

<script src="app.js"></script>
</body>
</html>
